# Complete portable MCL standard set plus repository lint and merge checks.
# Tools come from the owning development environment; Windows needs the same
# system tool roles. Preserve the existing additions-only 500 KB ceiling.
# POSIX generated native configuration is qualified separately.

minimum_pre_commit_version: "3.0.0"

repos:
  # --- The committed-binaries tier. Mandatory, strict by default. ---------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Preserve the original native 500 KB additions-only ceiling in the
      # portable constructor too; adopting the standard set must not loosen it.
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: https://github.com/metacraft-labs/devops-modules
    rev: 6ba34072850f7348e1669a6daf8a0acb79669434
    hooks:
      - id: ban-added-ct-recordings

  # --- Formatting and style. `language: system`, so the tool comes from the
  # --- dev env (Nix devShell on Linux/macOS, winget/scoop/choco on Windows)
  # --- rather than from a hook environment this file would have to pin per OS.
  # --- This is the portable hook pattern: the flake provides the TOOLS, the
  # --- committed config provides the RULES.
  #
  # MEMBERSHIP HERE MUST MATCH `git-hooks/standard-hooks.nix` EXACTLY. Two
  # expressions of one list that disagree are worse than one expression that is
  # awkward for half the fleet, because neither reader can tell which is the
  # rule. If you add a hook to one, add it to the other in the same commit.
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        types: [file]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: terraform-format
        name: terraform-format
        description: Format Terraform/OpenTofu HCL files
        entry: tofu fmt
        language: system
        types: [file]
        files: \.(tf|tftest\.hcl)$

      - id: prettier
        name: prettier
        entry: prettier --check --list-different=false --log-level=warn --ignore-unknown --write
        language: system
        types: [text]

      - id: lint
        name: repository lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
