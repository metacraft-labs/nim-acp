name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required Reprobuild coverage; unavailable capacity stays queued.
          # The separate Nix workflow retains its original three Unix legs.
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        if: runner.os != 'Windows'
        with:
          # The pinned reprobuild package below is published to the private
          # Attic cache by reprobuild's release workflow. Without the
          # substituter and a pull-capable token this lane reads only
          # cache.nixos.org and compiles the engine from source (28-38 min).
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      - name: Bind explicit Linux Repro runtime source
        id: linux_runtime
        if: matrix.os == 'linux'
        shell: bash
        env:
          NIX_CONFIG: access-tokens = github.com=${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          own_sha="$(git rev-parse HEAD)"
          test "$own_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          own_root="$(git rev-parse --show-toplevel)"
          receipt="$(mktemp -d "$RUNNER_TEMP/acp-repro-runtime-receipt.XXXXXXXXXX")"
          printf 'receipt_path=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
          receipt_python_out="$(nix build --no-link --print-out-paths --no-update-lock-file "git+file://$own_root?rev=$own_sha&shallow=1#ci-receipt-python")"
          test -x "$receipt_python_out/bin/python3"
          receipt_python="$receipt_python_out/bin/python3"
          package_json="$receipt/package-raw.json"
          "$receipt_python" ci/observe_linux_runtime_build.py --receipt-directory "$receipt" -- nix build --no-link --json --no-update-lock-file 'github:metacraft-labs/reprobuild/9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0#reprobuild' > "$package_json"
          package="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["outputs"]["out"])' "$package_json")"
          # A self-hosted runner may retain receipts from earlier jobs. Allocate
          # exclusively and export this job's path without touching prior evidence.
          printf '%s\n' "$receipt_python_out" > "$receipt/python-output.txt"
          nix path-info --derivation "$receipt_python_out" > "$receipt/python-derivation.txt"
          sha256sum "$receipt_python" > "$receipt/python-executable.sha256"
          "$receipt_python" --version > "$receipt/python-version.txt"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(json.dumps({"drvPath":x[0]["drvPath"],"outputs":x[0]["outputs"]},indent=2))' "$package_json" > "$receipt/package.json"
          test -x "$package/bin/repro"
          test -x "$package/bin/.repro-wrapped"
          test -x "$package/bin/.reprobuild-wrapped"
          test -x "$package/libexec/reprobuild-nix-daemon"
          # This lane takes the engine from a Nix package, not from
          # setup-reprobuild's source bootstrap, so nothing else exports an
          # interpreter. refresh-build-auth runs outside any dev shell, where
          # the runner image has no `python3`; it reads
          # REPROBUILD_BOOTSTRAP_PYTHON first
          # (metacraft-github-actions refresh-build-auth/refresh.sh).
          {
            printf 'REPROBUILD_REPRO=%s/bin/repro\n' "$package"
            printf 'REPROBUILD_NIX_DAEMON_BIN=%s/libexec/reprobuild-nix-daemon\n' "$package"
            printf 'REPROBUILD_BOOTSTRAP_PYTHON=%s\n' "$receipt_python"
          } >> "$GITHUB_ENV"
          printf '%s/bin\n' "$package" >> "$GITHUB_PATH"
          nix flake metadata --json --no-update-lock-file 'github:metacraft-labs/reprobuild/9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0' > "$receipt/source-raw.json"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["locked"]["rev"]=="9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0"; print(json.dumps({"locked":x["locked"],"path":x["path"]},indent=2))' "$receipt/source-raw.json" > "$receipt/source.json"
          source_root="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["locked"]["rev"]=="9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0"; print(x["path"])' "$receipt/source-raw.json")"
          nix flake prefetch --json --no-update-lock-file 'github:metacraft-labs/reprobuild/9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0' > "$receipt/source-prefetch.json"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); prefetch=json.load(open(sys.argv[2])); assert metadata["locked"]["rev"]=="9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0"; assert prefetch["storePath"]==metadata["path"]; assert prefetch["hash"]==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/source-prefetch.json"
          nix hash path --type sha256 --sri "$source_root" > "$receipt/source-realized-nar-hash.txt"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); assert open(sys.argv[2]).read().strip()==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/source-realized-nar-hash.txt"
          sha256sum "$source_root/flake.nix" "$source_root/flake.lock" "$package/bin/repro" "$package/bin/.repro-wrapped" "$package/bin/.reprobuild-wrapped" "$package/libexec/reprobuild-nix-daemon" | tee "$receipt/identities.sha256"

          runtime_system="$("$receipt_python" -c 'import platform,sys; assert sys.platform=="linux"; machine=platform.machine(); assert machine in ("x86_64","aarch64","arm64"); print({"x86_64":"x86_64-linux","aarch64":"aarch64-linux","arm64":"aarch64-linux"}[machine])')"
          package_drv="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["drvPath"])' "$package_json")"
          nix derivation show "$package_drv" > "$receipt/package-derivation-raw.json"
          drv_source="$("$receipt_python" ci/nix_derivation.py "$receipt/package-derivation-raw.json" "$package_drv" "$package" "$runtime_system")"
          nix hash path --type sha256 --sri "$drv_source" > "$receipt/package-derivation-source-nar-hash.txt"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); actual=open(sys.argv[2]).read().strip(); assert actual==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/package-derivation-source-nar-hash.txt"

          # The standalone CLI package does not carry the RunQuota daemon.
          # Select its public package through this exact SDK's locked input, so
          # the SDK's follows graph and source revision govern the daemon too.
          runquota_expr="(builtins.getFlake \"github:metacraft-labs/reprobuild/9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0\").inputs.runquota-src.packages.$runtime_system.default"
          nix build --no-link --json --no-update-lock-file --expr "$runquota_expr" > "$receipt/runquota-package-raw.json"
          runquota_package="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["outputs"]["out"])' "$receipt/runquota-package-raw.json")"
          runquota_drv="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["drvPath"])' "$receipt/runquota-package-raw.json")"
          nix derivation show "$runquota_drv" > "$receipt/runquota-derivation-raw.json"
          runquota_drv_source="$("$receipt_python" ci/nix_derivation.py "$receipt/runquota-derivation-raw.json" "$runquota_drv" "$runquota_package" "$runtime_system")"
          nix hash path --type sha256 --sri "$runquota_drv_source" > "$receipt/runquota-derivation-source-nar-hash.txt"
          nix path-info --json --recursive "$runquota_package" > "$receipt/runquota-closure.json"
          "$receipt_python" - "$source_root" "$receipt" "$runquota_package" "$runquota_drv" "$runtime_system" <<'PY_RUNQUOTA'
          import hashlib,json,os,sys
          from pathlib import Path
          source,receipt,package,drv,system=sys.argv[1:];receipt=Path(receipt);package=Path(package)
          lock=json.loads((Path(source)/'flake.lock').read_text());node=lock['nodes'][lock['nodes'][lock['root']]['inputs']['runquota-src']]['locked']
          assert node['type']=='github' and node['owner']=='metacraft-labs' and node['repo']=='runquota' and len(node['rev'])==40
          assert (receipt/'runquota-derivation-source-nar-hash.txt').read_text().strip()==node['narHash']
          images={};expected_machine={'x86_64-linux':62,'aarch64-linux':183}[system]
          for name in ('runquota','runquotad'):
              executable=package/'bin'/name;assert executable.is_file() and os.access(executable,os.X_OK)
              body=executable.read_bytes();assert body[:6]==b'\x7fELF\x02\x01' and int.from_bytes(body[18:20],'little')==expected_machine
              images[name]=hashlib.sha256(body).hexdigest()
          closure=json.loads((receipt/'runquota-closure.json').read_text());rows=closure if isinstance(closure,list) else [dict(value,path=key) for key,value in closure.items()]
          assert any(row['path']==str(package) for row in rows)
          (receipt/'runquota-identity.json').write_text(json.dumps({'selectedSDK':'9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0','lockedRunQuotaInput':node,'system':system,'package':str(package),'drvPath':drv,'imagesSHA256':images,'closureSHA256':hashlib.sha256((receipt/'runquota-closure.json').read_bytes()).hexdigest()},indent=2)+'\n')
          PY_RUNQUOTA
          printf 'RUNQUOTAD_BIN=%s/bin/runquotad\n' "$runquota_package" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$runquota_package" >> "$GITHUB_PATH"

      - name: Retain Linux runtime source and package identities
        if: always() && matrix.os == 'linux' && steps.linux_runtime.outputs.receipt_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: acp-repro-runtime-${{ matrix.arch }}
          path: ${{ steps.linux_runtime.outputs.receipt_path }}
          if-no-files-found: warn
          retention-days: 7

      # Setup consumes Repro to materialize this environment. Acquire the exact
      # declared Linux package first, including on runners without a release asset.

      # Mint a second installation token immediately before setup-dev-env.
      # On the Linux lane the Nix build of the reprobuild package above is not
      # in a binary cache and takes 28-38 minutes, so setup-dev-env can start
      # more than an hour after the first mint (job 131177548993: its source
      # clone failed with "could not read Username" on a 61-minute-old token).
      # The `app-id`/`app-private-key` broker rotates only the Nix credential;
      # setup-dev-env's Git CLI credential stays `gh-token` and cannot be
      # rotated while it runs (metacraft-pm issue
      # 2026-11-12-shared-actions-git-cli-credential-expires-an-hour-after-gh-token-and-the-broker-cannot-rotate-it).
      # The first token (ci_token) stays for the steps before this one.
      - name: Mint a fresh installation token for setup-dev-env
        id: ci_token_setup
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # workspace-lock-pinned revisions before materialising the env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@8ee1026a5d427a7aa5cf8c036fab12cb3d009503
        with:
          env-flavor: reprobuild
          repro-from-source: ${{ matrix.os == 'linux' && 'false' || 'true' }}
          # Reprobuild v0.2.23. The engine reads the committed v3 lock; older
          # engines fail with "unsupported lock schema ...v3 (expected ...v2)".
          # Keep the bootstrap libraries at that engine's own flake-lock
          # revisions. The Linux lane takes the same engine from the exact Nix
          # package bound above.
          repro-build-pin: 9dbf4e710d7cc0b9a79a4bcd54c931afb6849dd0
          repro-runquota-pin: 9818dc0c90be8ba7993424a7bbfbb6e009ffa965
          repro-io-mon-pin: 7a9b2f331024f4bc0b952bcab89b1dc48525d804
          repro-stackable-hooks-pin: c1d55ce33fb2a29e4cf8d8bdbe1713f355370d0a
          gh-token: ${{ steps.ci_token_setup.outputs.token }}
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # Publish repro build outputs to the fleet binary cache (per-repo
          # secrets; org-wide secrets aren't readable in private repos).
          repro-publish-key: ${{ secrets.REPRO_PUBLISH_KEY }}
          repro-publish-cert: ${{ secrets.REPRO_PUBLISH_CERT }}

      - name: Verify CI engine reads the committed lock
        if: matrix.os == 'linux'
        shell: bash
        env:
          RECEIPT: ${{ steps.linux_runtime.outputs.receipt_path }}
        run: |
          set -euo pipefail
          # The engine comes from the exact Nix package bound above, so read the
          # realised source tree of that revision recorded in the receipt.
          py="$(cat "$RECEIPT/python-output.txt")/bin/python3"
          source_root="$("$py" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$RECEIPT/source.json")"
          dev-exec "$py" tests/test_ci_engine_reads_committed_lock.py --reprobuild "$source_root"

      - name: Report exact Repro environment
        if: runner.os != 'Windows'
        run: |
          pwd
          git rev-parse HEAD
          command -v repro
          repro --version

      - name: Report exact Windows Repro environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Location
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-Command repro -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          repro --version
          exit $LASTEXITCODE

      - name: Admit declared native Windows x64 fixture tools
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          & ./ci/admit-native-windows-x64-fixture-tools.ps1 | Tee-Object -FilePath native-windows-fixture-tools.json
          exit $LASTEXITCODE

      - name: Retain declared Windows fixture tool admission
        if: always() && runner.os == 'Windows' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64-fixture-tools
          path: nim-acp/native-windows-fixture-tools.json
          if-no-files-found: warn

      - name: Admit the declared native Windows Just task runner
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          & ./ci/admit-native-windows-just-tool.ps1 | Tee-Object -FilePath native-windows-just-tool.json
          exit $LASTEXITCODE

      - name: Refresh authentication before repro build
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: repro build
        # Builds the conventional `build` collection declared in
        # `repro.nim`. Verifies the primary shipping artefact (the
        # recorder binary or extension) materialises through the
        # reprobuild engine identically to `just build`.
        run: dev-exec repro build ${{ runner.os == 'Linux' && '--tool-provisioning=nix' || '' }}

      - name: Refresh authentication before repro test
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: repro test
        # Materialises the `test` collection.
        run: dev-exec repro test ${{ runner.os == 'Linux' && '--tool-provisioning=nix' || '' }}

      - name: Refresh authentication before just build (cross-check)
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: Refresh authentication before just test (cross-check)
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: just test (cross-check)
        run: dev-exec just test

      - name: Observe native Darwin cleanup after original failure
        if: ${{ failure() && runner.os == 'macOS' }}
        shell: bash
        run: dev-exec nim c -r -d:acpAdmissionDiagnostics --nimcache:.nimcache/tests/acp-repro-admission-diagnostic --out:build/test_send_with_stream_repro_admission_diagnostic --path:src tests/test_send_with_stream.nim 2>&1 | tee repro-admission-diagnostic.log

      - name: Observe declared Windows x64 fixture tools after original failure
        if: ${{ failure() && runner.os == 'Windows' && matrix.arch == 'x64' }}
        shell: pwsh
        run: |
          & ./ci/observe-cached-native-x64-git-tools.ps1 | Tee-Object -FilePath windows-fixture-tools-diagnostic.json
          exit $LASTEXITCODE

      - name: Retain selected Windows x64 installed Nim source after original failure
        if: ${{ failure() && runner.os == 'Windows' && matrix.arch == 'x64' }}
        shell: pwsh
        run: |
          & ./ci/observe-selected-windows-nim-runtime.ps1 | Tee-Object -FilePath windows-nim-runtime-diagnostic.json

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
            .repro/build/repro/path-only-tool-identities.inspect.json
            repro-admission-diagnostic.log
            windows-fixture-tools-diagnostic.json
            native-windows-just-tool.json
            windows-nim-runtime-diagnostic.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
