name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required Reprobuild coverage; unavailable capacity stays queued.
          # The separate Nix workflow retains its original three Unix legs.
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve prior checkout and construct a fresh owning root
        if: runner.os != 'Windows'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            /* Preserve prior checkout authority; never execute its hooks or replace unknown nodes. */
            const freshOwnedRoot = async function freshOwnedRoot({ core, io, workspace, temporary, repository }) {
              const fs = require('fs'), path = require('path'), crypto = require('crypto');
              const { execFileSync } = require('child_process');
              if (process.platform === 'win32') throw new Error('POSIX constructor required');
              if (repository !== 'metacraft-labs/nim-acp') throw new Error('Foreign event repository');
              for (const key of ['GIT_DIR','GIT_WORK_TREE','GIT_COMMON_DIR','GIT_CONFIG_PARAMETERS','GIT_CONFIG_COUNT'])
                if (process.env[key]) throw new Error('Inherited Git selector');
              const uid = BigInt(process.geteuid());
              const heldDirectories=[];
              const hold=p=>{const expected=directory(p),fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_DIRECTORY|fs.constants.O_NOFOLLOW);heldDirectories.push({path:p,fd,expected});assertHeld();};
              const assertHeld=()=>{for(const h of heldDirectories){const st=fs.fstatSync(h.fd,{bigint:true});if(st.dev.toString()!==h.expected.dev||st.ino.toString()!==h.expected.ino||!same(principal(h.path),h.expected))throw new Error('Held directory authority drift');}};
              const principal = (p) => {
                const s = fs.lstatSync(p, {bigint:true});
                return { dev:s.dev.toString(), ino:s.ino.toString(), uid:s.uid.toString(), gid:s.gid.toString(), mode:s.mode.toString() };
              };
              const directory = (p) => {
                if (!path.isAbsolute(p) || path.resolve(p) !== p || p === path.parse(p).root)
                  throw new Error('Invalid directory path');
                for (let a=p;;a=path.dirname(a)) {
                  const s=fs.lstatSync(a,{bigint:true});
                  if (!s.isDirectory() || s.isSymbolicLink()) throw new Error('Symlink or non-directory ancestry');
                  if (a===path.dirname(a)) break;
                }
                if (fs.realpathSync(p)!==p || fs.lstatSync(p,{bigint:true}).uid!==uid) throw new Error('Foreign directory owner');
                return principal(p);
              };
              const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
              const exists=(p)=>{try {fs.lstatSync(p);return true;}catch(e){if(e.code==='ENOENT')return false;throw e;}};
              try {
              const wp=directory(workspace), tp=directory(temporary), parent=path.dirname(workspace), pp=directory(parent);
              if (workspace===temporary || workspace.startsWith(temporary+path.sep) || temporary.startsWith(workspace+path.sep)) throw new Error('Nested roots');
              process.chdir(temporary);
              hold(workspace);hold(temporary);hold(parent);
              const sourceRoot=exists(path.join(workspace,'.git'))?workspace:path.join(workspace,'nim-acp');
              const gitdir=path.join(sourceRoot,'.git');
              if (!exists(gitdir)) {
                if (fs.readdirSync(workspace).length) throw new Error('Unknown non-repository workspace');
                core.info('Initial empty owning workspace retained'); return;
              }
              directory(sourceRoot); directory(gitdir);
              if (exists(path.join(gitdir,'commondir')) || exists(path.join(gitdir,'objects/info/alternates'))) throw new Error('Shared Git authority');
              const image=await io.which('git',true);
              const run=(args)=>execFileSync(image,['--no-optional-locks','-C',sourceRoot,...args],{env:{...process.env,GIT_OPTIONAL_LOCKS:'0',GIT_NO_LAZY_FETCH:'1'},encoding:'utf8'});
              const origin=run(['config','--no-includes','--local','--get','remote.origin.url']).trim();
              if (!['https://github.com/'+repository,'https://github.com/'+repository+'.git','git@github.com:'+repository+'.git'].includes(origin)) throw new Error('Foreign origin');
              if (run(['rev-parse','--show-toplevel']).trim()!==sourceRoot) throw new Error('Foreign worktree root');
              const file=(p)=> {
                const before=fs.lstatSync(p,{bigint:true});
                if (before.isSymbolicLink()) {
                  const original=principal(p),target=fs.readlinkSync(p,{encoding:'buffer'}).toString('hex');
                  if(!same(principal(p),original)) throw new Error('Source symlink changed');
                  return {principal:original,target};
                }
                if (!before.isFile()) throw new Error('Non-regular source');
                const fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
                try {
                  const opened=fs.fstatSync(fd,{bigint:true});
                  if (opened.dev!==before.dev||opened.ino!==before.ino) throw new Error('Source replaced');
                  const bytes=fs.readFileSync(fd), after=fs.fstatSync(fd,{bigint:true});
                  if (after.size!==opened.size||after.mtimeNs!==opened.mtimeNs||!same(principal(p),principalFromStat(opened))) throw new Error('Source changed');
                  return {principal:principal(p),sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
                } finally {fs.closeSync(fd);}
              };
              const principalFromStat=s=>({dev:s.dev.toString(),ino:s.ino.toString(),uid:s.uid.toString(),gid:s.gid.toString(),mode:s.mode.toString()});
              const identity=()=> {
                const entries=run(['ls-files','--stage','-z']).split('\0').filter(Boolean), tracked={};
                for(const row of entries) {
                  if(row.startsWith('160000 ')) throw new Error('Unsupported gitlink');
                  const name=row.slice(row.indexOf('\t')+1);
                  if (!name || path.isAbsolute(name) || name.split('/').includes('..')) throw new Error('Invalid source member');
                  tracked[name]=file(path.join(sourceRoot,name));
                }
                return {root:directory(workspace),sourceRoot:directory(sourceRoot),git:directory(gitdir),head:run(['rev-parse','--verify','HEAD']).trim(),entries,config:file(path.join(gitdir,'config')),index:file(path.join(gitdir,'index')),tracked};
              };
              for(const p of [path.join(gitdir,'config'),path.join(gitdir,'index')]) if(!fs.lstatSync(p).isFile()||fs.lstatSync(p).isSymbolicLink()) throw new Error('Git metadata kind');
              const before=identity();
              if(!/^[0-9a-f]{40}$/.test(before.head)) throw new Error('Invalid source HEAD');
              if (!same(directory(parent),pp)||!same(directory(workspace),wp)||!same(directory(temporary),tp)) throw new Error('Directory authority changed');
              assertHeld();
              const held=fs.mkdtempSync(path.join(parent,'.acp-preserved-checkout-'));
              const hp=directory(held);
              if ((BigInt(hp.mode)&0o777n)!==0o700n || hp.dev!==wp.dev) throw new Error('Nonexclusive or cross-device preservation');
              const destination=path.join(held,'workspace');
              if(exists(destination)) throw new Error('Occupied preservation destination');
              if(!same(identity(),before)||!same(directory(parent),pp)||!same(directory(held),hp)) throw new Error('Pre-rename authority drift');
              assertHeld();
              fs.renameSync(workspace,destination);
              for(const h of heldDirectories)if(h.path===workspace||h.path.startsWith(workspace+path.sep))h.path=destination+h.path.slice(workspace.length);
              if(!same(directory(destination),wp)) throw new Error('Preserved root identity drift');
              try {fs.mkdirSync(workspace,{mode:Number(BigInt(wp.mode)&0o777n)});}
              catch(error) {
                if(exists(workspace)) throw new Error('Occupied rollback destination; preserved checkout retained');
                if(!same(directory(destination),wp)||!same(directory(parent),pp)) throw new Error('Rollback authority drift');
                fs.renameSync(destination,workspace); throw new Error('Root creation failed; original checkout restored');
              }
              assertHeld();directory(workspace);
              core.info('Fresh owning root created; exact previous checkout retained at '+JSON.stringify(destination));
              } finally {for(const h of heldDirectories)fs.closeSync(h.fd);}
            };

            await freshOwnedRoot({ core, io, workspace:process.env.GITHUB_WORKSPACE, temporary:process.env.RUNNER_TEMP, repository:process.env.GITHUB_REPOSITORY });

      - uses: actions/checkout@v4

      - name: Bind checkout-time Git constructor
        id: checkout_git
        if: runner.os != 'Windows'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7, supplied Node 20 runtime
        with:
          script: |
            const root = process.env.GITHUB_WORKSPACE;
            const bind = require(require("path").join(root, "ci", "bind-checkout-creator.cjs"));
            await bind({ core, io, root });

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.).  GitHub free plan restricts org-level
      # secrets with visibility ALL from being readable in private repos,
      # so we mint per-run tokens from the app secrets stored at repo
      # level (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Materialize the owning Git role without activating the guarded shell.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        if: runner.os != 'Windows'
      - name: Authenticate and transition initial checkout Git samples
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nix run .#ci-initial-samples -- --creator-binding "${{ steps.checkout_git.outputs.binding }}"

      - name: Bind explicit Linux Repro runtime source
        id: linux_runtime
        if: matrix.os == 'linux'
        shell: bash
        env:
          NIX_CONFIG: access-tokens = github.com=${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          own_sha="$(git rev-parse HEAD)"
          test "$own_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          own_root="$(git rev-parse --show-toplevel)"
          receipt="$(mktemp -d "$RUNNER_TEMP/acp-repro-runtime-receipt.XXXXXXXXXX")"
          printf 'receipt_path=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
          receipt_python_out="$(nix build --no-link --print-out-paths --no-update-lock-file "git+file://$own_root?rev=$own_sha&shallow=1#ci-receipt-python")"
          test -x "$receipt_python_out/bin/python3"
          receipt_python="$receipt_python_out/bin/python3"
          package_json="$receipt/package-raw.json"
          nix build --no-link --json --no-update-lock-file 'github:metacraft-labs/reprobuild/76659f5730ecf698b1963c656494d2cb66eb256d#reprobuild'  > "$package_json"
          package="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["outputs"]["out"])' "$package_json")"
          # A self-hosted runner may retain receipts from earlier jobs. Allocate
          # exclusively and export this job's path without touching prior evidence.
          printf '%s\n' "$receipt_python_out" > "$receipt/python-output.txt"
          nix path-info --derivation "$receipt_python_out" > "$receipt/python-derivation.txt"
          sha256sum "$receipt_python" > "$receipt/python-executable.sha256"
          "$receipt_python" --version > "$receipt/python-version.txt"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(json.dumps({"drvPath":x[0]["drvPath"],"outputs":x[0]["outputs"]},indent=2))' "$package_json" > "$receipt/package.json"
          test -x "$package/bin/repro"
          test -x "$package/bin/.repro-wrapped"
          test -x "$package/bin/.reprobuild-wrapped"
          test -x "$package/libexec/reprobuild-nix-daemon"
          printf 'REPROBUILD_REPRO=%s/bin/repro\n' "$package" >> "$GITHUB_ENV"
          printf 'REPROBUILD_NIX_DAEMON_BIN=%s/libexec/reprobuild-nix-daemon\n' "$package" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$package" >> "$GITHUB_PATH"
          nix flake metadata --json --no-update-lock-file 'github:metacraft-labs/reprobuild/76659f5730ecf698b1963c656494d2cb66eb256d' > "$receipt/source-raw.json"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["locked"]["rev"]=="76659f5730ecf698b1963c656494d2cb66eb256d"; print(json.dumps({"locked":x["locked"],"path":x["path"]},indent=2))' "$receipt/source-raw.json" > "$receipt/source.json"
          source_root="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["locked"]["rev"]=="76659f5730ecf698b1963c656494d2cb66eb256d"; print(x["path"])' "$receipt/source-raw.json")"
          nix flake prefetch --json --no-update-lock-file 'github:metacraft-labs/reprobuild/76659f5730ecf698b1963c656494d2cb66eb256d' > "$receipt/source-prefetch.json"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); prefetch=json.load(open(sys.argv[2])); assert metadata["locked"]["rev"]=="76659f5730ecf698b1963c656494d2cb66eb256d"; assert prefetch["storePath"]==metadata["path"]; assert prefetch["hash"]==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/source-prefetch.json"
          nix hash path --type sha256 --sri "$source_root" > "$receipt/source-realized-nar-hash.txt"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); assert open(sys.argv[2]).read().strip()==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/source-realized-nar-hash.txt"
          sha256sum "$source_root/flake.nix" "$source_root/flake.lock" "$package/bin/repro" "$package/bin/.repro-wrapped" "$package/bin/.reprobuild-wrapped" "$package/libexec/reprobuild-nix-daemon" | tee "$receipt/identities.sha256"

          package_drv="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["drvPath"])' "$package_json")"
          nix derivation show "$package_drv" > "$receipt/package-derivation-raw.json"
          drv_source="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; d=next(iter(x.values())); from pathlib import PurePosixPath; out=d["outputs"]["out"]["path"]; assert out in (sys.argv[2],PurePosixPath(sys.argv[2]).name); print(d["env"]["src"])' "$receipt/package-derivation-raw.json" "$package")"
          nix hash path --type sha256 --sri "$drv_source" > "$receipt/package-derivation-source-nar-hash.txt"
          "$receipt_python" -c 'import json,sys; metadata=json.load(open(sys.argv[1])); actual=open(sys.argv[2]).read().strip(); assert actual==metadata["locked"]["narHash"]' "$receipt/source-raw.json" "$receipt/package-derivation-source-nar-hash.txt"

      - name: Retain Linux runtime source and package identities
        if: always() && matrix.os == 'linux' && steps.linux_runtime.outputs.receipt_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: acp-repro-runtime-${{ matrix.arch }}
          path: ${{ steps.linux_runtime.outputs.receipt_path }}
          if-no-files-found: warn
          retention-days: 7

      # Setup consumes Repro to materialize this environment. Acquire the exact
      # declared Linux package first, including on runners without a release asset.

      - name: Setup dev env (reprobuild flavor)
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # workspace-lock-pinned revisions before materialising the env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          repro-from-source: ${{ matrix.os == 'linux' && 'false' || 'true' }}
          repro-build-pin: "76659f5730ecf698b1963c656494d2cb66eb256d"
          gh-token: ${{ steps.ci_token.outputs.token }}
          # Publish repro build outputs to the fleet binary cache (per-repo
          # secrets; org-wide secrets aren't readable in private repos).
          repro-publish-key: ${{ secrets.REPRO_PUBLISH_KEY }}
          repro-publish-cert: ${{ secrets.REPRO_PUBLISH_CERT }}

      - name: Report exact Repro environment
        if: runner.os != 'Windows'
        run: |
          pwd
          git rev-parse HEAD
          command -v repro
          repro --version

      - name: Report exact Windows Repro environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Location
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-Command repro -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          repro --version
          exit $LASTEXITCODE

      - name: repro build
        # Builds the conventional `build` collection declared in
        # `repro.nim`. Verifies the primary shipping artefact (the
        # recorder binary or extension) materialises through the
        # reprobuild engine identically to `just build`.
        run: dev-exec repro build ${{ runner.os == 'Linux' && '--tool-provisioning=nix' || '' }}

      - name: repro test
        # Materialises the `test` collection.
        run: dev-exec repro test ${{ runner.os == 'Linux' && '--tool-provisioning=nix' || '' }}

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: just test (cross-check)
        run: dev-exec just test

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
            .repro/build/repro/path-only-tool-identities.inspect.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
