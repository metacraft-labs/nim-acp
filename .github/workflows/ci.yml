              const run=(args)=>execFileSync(image,['--no-optional-locks','-C',sourceRoot,...args],{env:{...process.env,GIT_OPTIONAL_LOCKS:'0',GIT_NO_LAZY_FETCH:'1'},encoding:'utf8'});
              const origin=run(['config','--no-includes','--local','--get','remote.origin.url']).trim();
              if (!['https://github.com/'+repository,'https://github.com/'+repository+'.git','git@github.com:'+repository+'.git'].includes(origin)) throw new Error('Foreign origin');
              if (run(['rev-parse','--show-toplevel']).trim()!==sourceRoot) throw new Error('Foreign worktree root');
              const file=(p)=> {
                const before=fs.lstatSync(p,{bigint:true});
                if (before.isSymbolicLink()) {
                  const original=principal(p),target=fs.readlinkSync(p,{encoding:'buffer'}).toString('hex');
                  if(!same(principal(p),original)) throw new Error('Source symlink changed');
                  return {principal:original,target};
                }
                if (!before.isFile()) throw new Error('Non-regular source');
                const fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
                try {
                  const opened=fs.fstatSync(fd,{bigint:true});
                  if (opened.dev!==before.dev||opened.ino!==before.ino) throw new Error('Source replaced');
                  const bytes=fs.readFileSync(fd), after=fs.fstatSync(fd,{bigint:true});
                  if (after.size!==opened.size||after.mtimeNs!==opened.mtimeNs||!same(principal(p),principalFromStat(opened))) throw new Error('Source changed');
                  return {principal:principal(p),sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
                } finally {fs.closeSync(fd);}
              };
              const principalFromStat=s=>({dev:s.dev.toString(),ino:s.ino.toString(),uid:s.uid.toString(),gid:s.gid.toString(),mode:s.mode.toString()});
              const identity=()=> {
                const entries=run(['ls-files','--stage','-z']).split('\0').filter(Boolean), tracked={};
                for(const row of entries) {
                  if(row.startsWith('160000 ')) throw new Error('Unsupported gitlink');
                  const name=row.slice(row.indexOf('\t')+1);
                  if (!name || path.isAbsolute(name) || name.split('/').includes('..')) throw new Error('Invalid source member');
                  tracked[name]=file(path.join(sourceRoot,name));
                }
                return {root:directory(workspace),sourceRoot:directory(sourceRoot),git:directory(gitdir),head:run(['rev-parse','--verify','HEAD']).trim(),entries,config:file(path.join(gitdir,'config')),index:file(path.join(gitdir,'index')),tracked};
              };
              for(const p of [path.join(gitdir,'config'),path.join(gitdir,'index')]) if(!fs.lstatSync(p).isFile()||fs.lstatSync(p).isSymbolicLink()) throw new Error('Git metadata kind');
              const before=identity();
              if(!/^[0-9a-f]{40}$/.test(before.head)) throw new Error('Invalid source HEAD');
              if (!same(directory(parent),pp)||!same(directory(workspace),wp)||!same(directory(temporary),tp)) throw new Error('Directory authority changed');
              assertHeld();
              const held=fs.mkdtempSync(path.join(parent,'.acp-preserved-checkout-'));
              const hp=directory(held);
              if ((BigInt(hp.mode)&0o777n)!==0o700n || hp.dev!==wp.dev) throw new Error('Nonexclusive or cross-device preservation');
              const destination=path.join(held,'workspace');
              if(exists(destination)) throw new Error('Occupied preservation destination');
              if(!same(identity(),before)||!same(directory(parent),pp)||!same(directory(held),hp)) throw new Error('Pre-rename authority drift');
              assertHeld();
              fs.renameSync(workspace,destination);
              for(const h of heldDirectories)if(h.path===workspace||h.path.startsWith(workspace+path.sep))h.path=destination+h.path.slice(workspace.length);
              if(!same(directory(destination),wp)) throw new Error('Preserved root identity drift');
              try {fs.mkdirSync(workspace,{mode:Number(BigInt(wp.mode)&0o777n)});}
              catch(error) {
                if(exists(workspace)) throw new Error('Occupied rollback destination; preserved checkout retained');
                if(!same(directory(destination),wp)||!same(directory(parent),pp)) throw new Error('Rollback authority drift');
                fs.renameSync(destination,workspace); throw new Error('Root creation failed; original checkout restored');
              }
              assertHeld();directory(workspace);
              core.info('Fresh owning root created; exact previous checkout retained at '+JSON.stringify(destination));
              } finally {for(const h of heldDirectories)fs.closeSync(h.fd);}
            };

            await freshOwnedRoot({ core, io, workspace:process.env.GITHUB_WORKSPACE, temporary:process.env.RUNNER_TEMP, repository:process.env.GITHUB_REPOSITORY });

      - uses: actions/checkout@v4
        with:
          path: nim-acp
      # install-nix-action fails SILENTLY on the self-hosted eph-* classes: a Nix
      # client is already shimmed in, so it exits 0 in ~50ms without applying
      # extra_nix_config, and the next step dies on "experimental Nix feature
      # 'nix-command' is disabled". setup-nix writes nix.conf unconditionally
      # and then VERIFIES the features are live.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: nix build .#default 2>&1 | tee nix-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log-${{ join(matrix.runner, '-') }}
          path: nim-acp/nix-build.log
