name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    defaults:
      run:
        working-directory: nim-acp
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            [self-hosted, linux, x64],
            [self-hosted, linux, arm64],
            [self-hosted, macos, arm64],
          ]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve prior checkout and construct a fresh owning root
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            /* Preserve prior checkout authority; never execute its hooks or replace unknown nodes. */
            const freshOwnedRoot = async function freshOwnedRoot({ core, io, workspace, temporary, repository }) {
              const fs = require('fs'), path = require('path'), crypto = require('crypto');
              const { execFileSync } = require('child_process');
              if (process.platform === 'win32') throw new Error('POSIX constructor required');
              if (repository !== 'metacraft-labs/nim-acp') throw new Error('Foreign event repository');
              for (const key of ['GIT_DIR','GIT_WORK_TREE','GIT_COMMON_DIR','GIT_CONFIG_PARAMETERS','GIT_CONFIG_COUNT'])
                if (process.env[key]) throw new Error('Inherited Git selector');
              const uid = BigInt(process.geteuid());
              const heldDirectories=[];
              const hold=p=>{const expected=directory(p),fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_DIRECTORY|fs.constants.O_NOFOLLOW);heldDirectories.push({path:p,fd,expected});assertHeld();};
              const assertHeld=()=>{for(const h of heldDirectories){const st=fs.fstatSync(h.fd,{bigint:true});if(st.dev.toString()!==h.expected.dev||st.ino.toString()!==h.expected.ino||!same(principal(h.path),h.expected))throw new Error('Held directory authority drift');}};
              const principal = (p) => {
                const s = fs.lstatSync(p, {bigint:true});
                return { dev:s.dev.toString(), ino:s.ino.toString(), uid:s.uid.toString(), gid:s.gid.toString(), mode:s.mode.toString() };
              };
              const directory = (p) => {
                if (!path.isAbsolute(p) || path.resolve(p) !== p || p === path.parse(p).root)
                  throw new Error('Invalid directory path');
                for (let a=p;;a=path.dirname(a)) {
                  const s=fs.lstatSync(a,{bigint:true});
                  if (!s.isDirectory() || s.isSymbolicLink()) throw new Error('Symlink or non-directory ancestry');
                  if (a===path.dirname(a)) break;
                }
                if (fs.realpathSync(p)!==p || fs.lstatSync(p,{bigint:true}).uid!==uid) throw new Error('Foreign directory owner');
                return principal(p);
              };
              const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
              const exists=(p)=>{try {fs.lstatSync(p);return true;}catch(e){if(e.code==='ENOENT')return false;throw e;}};
              try {
              const wp=directory(workspace), tp=directory(temporary), parent=path.dirname(workspace), pp=directory(parent);
              if (workspace===temporary || workspace.startsWith(temporary+path.sep) || temporary.startsWith(workspace+path.sep)) throw new Error('Nested roots');
              process.chdir(temporary);
              hold(workspace);hold(temporary);hold(parent);
              const sourceRoot=exists(path.join(workspace,'.git'))?workspace:path.join(workspace,'nim-acp');
              const gitdir=path.join(sourceRoot,'.git');
              if (!exists(gitdir)) {
                if (fs.readdirSync(workspace).length) throw new Error('Unknown non-repository workspace');
                core.info('Initial empty owning workspace retained'); return;
              }
              directory(sourceRoot); directory(gitdir);
              if (exists(path.join(gitdir,'commondir')) || exists(path.join(gitdir,'objects/info/alternates'))) throw new Error('Shared Git authority');
              const image=await io.which('git',true);
              const run=(args)=>execFileSync(image,['--no-optional-locks','-C',sourceRoot,...args],{env:{...process.env,GIT_OPTIONAL_LOCKS:'0',GIT_NO_LAZY_FETCH:'1'},encoding:'utf8'});
              const origin=run(['config','--no-includes','--local','--get','remote.origin.url']).trim();
              if (!['https://github.com/'+repository,'https://github.com/'+repository+'.git','git@github.com:'+repository+'.git'].includes(origin)) throw new Error('Foreign origin');
              if (run(['rev-parse','--show-toplevel']).trim()!==sourceRoot) throw new Error('Foreign worktree root');
              const file=(p)=> {
                const before=fs.lstatSync(p,{bigint:true});
                if (before.isSymbolicLink()) {
                  const original=principal(p),target=fs.readlinkSync(p,{encoding:'buffer'}).toString('hex');
                  if(!same(principal(p),original)) throw new Error('Source symlink changed');
                  return {principal:original,target};
                }
                if (!before.isFile()) throw new Error('Non-regular source');
                const fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
                try {
                  const opened=fs.fstatSync(fd,{bigint:true});
                  if (opened.dev!==before.dev||opened.ino!==before.ino) throw new Error('Source replaced');
                  const bytes=fs.readFileSync(fd), after=fs.fstatSync(fd,{bigint:true});
                  if (after.size!==opened.size||after.mtimeNs!==opened.mtimeNs||!same(principal(p),principalFromStat(opened))) throw new Error('Source changed');
                  return {principal:principal(p),sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
                } finally {fs.closeSync(fd);}
              };
              const principalFromStat=s=>({dev:s.dev.toString(),ino:s.ino.toString(),uid:s.uid.toString(),gid:s.gid.toString(),mode:s.mode.toString()});
              const identity=()=> {
                const entries=run(['ls-files','--stage','-z']).split('\0').filter(Boolean), tracked={};
                for(const row of entries) {
                  if(row.startsWith('160000 ')) throw new Error('Unsupported gitlink');
                  const name=row.slice(row.indexOf('\t')+1);
                  if (!name || path.isAbsolute(name) || name.split('/').includes('..')) throw new Error('Invalid source member');
                  tracked[name]=file(path.join(sourceRoot,name));
                }
                return {root:directory(workspace),sourceRoot:directory(sourceRoot),git:directory(gitdir),head:run(['rev-parse','--verify','HEAD']).trim(),entries,config:file(path.join(gitdir,'config')),index:file(path.join(gitdir,'index')),tracked};
              };
              for(const p of [path.join(gitdir,'config'),path.join(gitdir,'index')]) if(!fs.lstatSync(p).isFile()||fs.lstatSync(p).isSymbolicLink()) throw new Error('Git metadata kind');
              const before=identity();
              if(!/^[0-9a-f]{40}$/.test(before.head)) throw new Error('Invalid source HEAD');
              if (!same(directory(parent),pp)||!same(directory(workspace),wp)||!same(directory(temporary),tp)) throw new Error('Directory authority changed');
              assertHeld();
              const held=fs.mkdtempSync(path.join(parent,'.acp-preserved-checkout-'));
              const hp=directory(held);
              if ((BigInt(hp.mode)&0o777n)!==0o700n || hp.dev!==wp.dev) throw new Error('Nonexclusive or cross-device preservation');
              const destination=path.join(held,'workspace');
              if(exists(destination)) throw new Error('Occupied preservation destination');
              if(!same(identity(),before)||!same(directory(parent),pp)||!same(directory(held),hp)) throw new Error('Pre-rename authority drift');
              assertHeld();
              fs.renameSync(workspace,destination);
              for(const h of heldDirectories)if(h.path===workspace||h.path.startsWith(workspace+path.sep))h.path=destination+h.path.slice(workspace.length);
              if(!same(directory(destination),wp)) throw new Error('Preserved root identity drift');
              try {fs.mkdirSync(workspace,{mode:Number(BigInt(wp.mode)&0o777n)});}
              catch(error) {
                if(exists(workspace)) throw new Error('Occupied rollback destination; preserved checkout retained');
                if(!same(directory(destination),wp)||!same(directory(parent),pp)) throw new Error('Rollback authority drift');
                fs.renameSync(destination,workspace); throw new Error('Root creation failed; original checkout restored');
              }
              assertHeld();directory(workspace);
              core.info('Fresh owning root created; exact previous checkout retained at '+JSON.stringify(destination));
              } finally {for(const h of heldDirectories)fs.closeSync(h.fd);}
            };

            await freshOwnedRoot({ core, io, workspace:process.env.GITHUB_WORKSPACE, temporary:process.env.RUNNER_TEMP, repository:process.env.GITHUB_REPOSITORY });

      - uses: actions/checkout@v4
        with:
          path: nim-acp
      - name: Bind checkout-time Git constructor
        id: checkout_git
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7, supplied Node 20 runtime
        with:
          script: |
            const root = require("path").join(process.env.GITHUB_WORKSPACE, "nim-acp");
            const bind = require(require("path").join(root, "ci", "bind-checkout-creator.cjs"));
            await bind({ core, io, root });
      # install-nix-action fails SILENTLY on the self-hosted eph-* classes: a Nix
      # client is already shimmed in, so it exits 0 in ~50ms without applying
      # extra_nix_config, and the next step dies on "experimental Nix feature
      # 'nix-command' is disabled". setup-nix writes nix.conf unconditionally
      # and then VERIFIES the features are live.
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
      # `shell: bash` is load-bearing, not style. The default `run` shell is
      # `bash -e` WITHOUT pipefail, so `cmd | tee` takes tee's exit status and a
      # failing command was reported as a passing job. `shell: bash` selects
      # `bash --noprofile --norc -eo pipefail`.
      - name: Authenticate and transition initial checkout Git samples
        shell: bash
        run: |
          nix run .#ci-initial-samples -- --creator-binding "${{ steps.checkout_git.outputs.binding }}"
      - id: original_tests
        run: nix develop --command just test 2>&1 | tee test.log
        shell: bash
      - name: Observe native Darwin admission after original test failure
        if: ${{ failure() && runner.os == 'macOS' && steps.original_tests.outcome == 'failure' }}
        run: nix develop --command nim c -r -d:acpAdmissionDiagnostics --path:src tests/test_send_with_stream.nim 2>&1 | tee admission-diagnostic.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ join(matrix.runner, '-') }}
          path: nim-acp/test.log
      - name: Retain native admission diagnostic log
        if: ${{ always() && runner.os == 'macOS' && steps.original_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: admission-diagnostic-${{ join(matrix.runner, '-') }}
          path: nim-acp/admission-diagnostic.log
          if-no-files-found: warn

