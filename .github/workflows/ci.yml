name: CI

on:
  push:
    branches: [main]
  pull_request:

# Collapse superseded pull-request runs only.
#
# `github.head_ref` is set on `pull_request` and empty everywhere else, so PR
# runs group per source branch and a new push cancels the run it superseded.
# Pushes to the mainline branches fall through to `github.run_id`, which is
# unique per run: each keeps a group of its own and is never cancelled, so the
# per-commit build history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-everywhere
          path: ../nim-everywhere
      - uses: cachix/install-nix-action@v27
      # `shell: bash` is load-bearing, not style. The default `run` shell is
      # `bash -e` WITHOUT pipefail, so `cmd | tee` takes tee's exit status and a
      # failing command was reported as a passing job. `shell: bash` selects
      # `bash --noprofile --norc -eo pipefail`.
      - run: nix develop --command just test 2>&1 | tee test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.runner }}
          path: test.log
  lint:
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-everywhere
          path: ../nim-everywhere
      - uses: cachix/install-nix-action@v27
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: nix develop --command just lint 2>&1 | tee lint.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-${{ matrix.runner }}
          path: lint.log
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
      - run: nix build .#default 2>&1 | tee nix-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log-${{ matrix.runner }}
          path: nix-build.log
